<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Logístico Empresarial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container-fluid h-100">
        <div class="row h-100">
            <div class="col-md-3 sidebar">
                <h2>LOGÍSTICA BOT</h2>
                <hr>
                <ul class="menu">
                    <li>Dashboard</li>
                    <li>Mensagens</li>
                    <li>Pedidos</li>
                    <li>Chamados</li>
                    <li>Usuários</li>
                </ul>
            </div>
            <div class="col-md-9 p-0">
                <div class="chat-header">Assistente Logístico</div>
                <div id="chat-box"></div>
                <div class="chat-footer">
                    <div class="input-group">
                        <input id="mensagem" class="form-control" placeholder="Digite sua mensagem...">
                        <button class="btn btn-primary" onclick="enviarMensagem()">Enviar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/js/chat.js"></script>
</body>
</html>
